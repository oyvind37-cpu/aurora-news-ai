name: Check Cloudflare platform
on:
  pull_request:
    paths: ['platform/**', '.github/workflows/cloudflare-platform-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
