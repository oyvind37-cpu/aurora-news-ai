name: Publiser eksisterende KI-morgenbrief
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions-kjøringen som inneholder godkjent forhåndsvisning'
        required: true
        default: '39246208972'
permissions:
  actions: read
  contents: write
concurrency:
  group: aurora-ai-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Last ned eksisterende forhåndsvisning uten KI-kall
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name aurora-morgenbrief-preview --dir /tmp/aurora-preview
          cp /tmp/aurora-preview/morgenbrief-preview.json morgenbrief-ai.json
      - name: Valider kilder og format
        run: |
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          d=json.loads(Path('morgenbrief-ai.json').read_text())
          assert d.get('method')=='generative_ai_source_attributed'
          assert d.get('provider')=='cloudflare'
          assert isinstance(d.get('sources'),list) and d['sources']
          assert isinstance(d.get('analysis',{}).get('sections'),list) and d['analysis']['sections']
          ids={s['id'] for s in d['sources']}
          for s in d['analysis']['sections']:
              assert isinstance(s.get('text'),str)
              assert set(s.get('source_ids',[]))<=ids
          generated=datetime.datetime.fromisoformat(d['generated'].replace('Z','+00:00'))
          age=datetime.datetime.now(datetime.timezone.utc)-generated
          assert 0<=age.total_seconds()<=48*3600, 'Forhåndsvisningen er for gammel'
          print('Validert eksisterende KI-brief; ingen API-kall.')
          PY
      - name: Publiser til appens datakilde
        run: |
          git config user.name "aurora-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morgenbrief-ai.json
          if ! git diff --cached --quiet; then
            git commit -m "Publiser eksisterende KI-morgenbrief uten API-kostnad"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
