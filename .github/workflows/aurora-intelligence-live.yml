name: Aurora Intelligence - manuell KI-test
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Velg KI-leverandør; ingen kall uten TEST-bekreftelse'
        required: true
        type: choice
        options:
          - cloudflare
          - openai
      confirm_live_api:
        description: 'Skriv TEST for å tillate et ekte API-kall (kan bruke kvote/penger)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  live-preview:
    if: ${{ inputs.confirm_live_api == 'TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: aurora-ai-test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AURORA_OPENAI_MODEL: gpt-4.1-mini
      AURORA_CF_MODEL: '@cf/meta/llama-3.1-8b-instruct'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b6cc7069740167d589c05ce1ea377dd5a9366b4
      - name: Hent siste nyheter fra hovedgrenen uten å kjøre kode derfra
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:news.json > news.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Valider API-konfigurasjon uten å vise hemmeligheter
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          python - <<'PY'
          import os
          p = os.environ['PROVIDER']
          required = ('CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN') if p == 'cloudflare' else ('OPENAI_API_KEY',)
          if any(not os.environ.get(k) for k in required):
              raise SystemExit('Mangler nødvendige GitHub Secrets. Ingen modellkall utført.')
          print('Nødvendige secrets finnes; ingen verdier vises.')
          PY
      - name: Kjør sikkerhetstester først
        run: python -m unittest discover -s aurora-intelligence -p 'test_*.py' -v
      - name: Kontroller at nyhetsgrunnlaget er ferskt
        run: |
          python - <<'PY'
          import datetime, json
          from pathlib import Path
          data=json.loads(Path("news.json").read_text(encoding="utf-8"))
          updated=data.get("updated")
          if not updated:
              raise SystemExit("Mangler tidsstempel på nyhetsdata. Ingen KI-kall utført.")
          stamp=datetime.datetime.fromisoformat(updated.replace("Z","+00:00"))
          age=datetime.datetime.now(datetime.timezone.utc)-stamp
          if age.total_seconds()<0 or age.total_seconds()>6*3600:
              raise SystemExit("Nyhetsdata er eldre enn seks timer eller har fremtidig tidsstempel. Ingen KI-kall utført.")
          print("Nyhetsdata er ferskt nok til test.")
          PY
      - name: Lag KI-generert forhåndsvisning (ett API-kall)
        env:
          PROVIDER: ${{ inputs.provider }}
        run: python aurora-intelligence/engine.py --provider "$PROVIDER" --output aurora-intelligence/morgenbrief-preview.json
      - name: Last opp forhåndsvisning (ikke publisert)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-morgenbrief-preview
          path: aurora-intelligence/morgenbrief-preview.json
          retention-days: 1
