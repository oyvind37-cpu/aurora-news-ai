
name: Aurora News AI - Oppdater nyheter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: aurora-news-data
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent prosjektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kontroller Python-kode
        run: python -m py_compile fetch_news.py aurora_kildekontroll.py

      - name: Hent siste nyheter
        run: python fetch_news.py

      - name: Bygg kildekontrollert nyhetsbrief
        run: python aurora_kildekontroll.py

      - name: Lagre oppdaterte nyheter
        run: |
          git config user.name "aurora-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json brief.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater nyheter automatisk"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
