
name: Aurora News AI - Oppdater nyheter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: aurora-news-data
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent prosjektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hent siste nyheter
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          import fetch_news
          try:
              stamp = dt.datetime.fromisoformat(json.loads(Path('news.json').read_text())['updated'].replace('Z', '+00:00'))
              age = (dt.datetime.now(dt.timezone.utc) - stamp).total_seconds()
          except (ValueError, KeyError, OSError, TypeError):
              age = 999999
          if 0 <= age < 300:
              print('Nyhetsdata er yngre enn fem minutter; hopper over dobbel innhenting.')
          else:
              fetch_news.main()
          PY

      - name: Bygg kildekontrollert nyhetsbrief
        run: python aurora_kildekontroll.py

      - name: Lagre oppdaterte nyheter
        run: |
          git config user.name "aurora-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json brief.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater nyheter automatisk"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
