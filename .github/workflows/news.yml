
name: Aurora News AI - Oppdater nyheter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Hent prosjektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hent siste nyheter
        run: python fetch_news.py

      - name: Lagre oppdaterte nyheter
        run: |
          git config user.name "aurora-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater nyheter automatisk"
            git push
          fi
